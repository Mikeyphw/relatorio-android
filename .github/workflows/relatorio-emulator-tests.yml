# Opt-in hosted device tests; does not execute in Termux or qualify a release.
name: Relatorio Android Emulator Instrumentation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: relatorio-emulator-${{ github.ref }}
  cancel-in-progress: false
jobs:
  instrumentation:
    name: Android emulator smoke and PDF-export tests
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source before device test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/verify_relatorio_actions.py --static
          python3 tools/validate_phase9_10.py
          python3 tools/validate_phase4.py
          python3 tools/validate_phase5.py
          python3 tools/validate_phase6.py
          python3 tools/validate_phase7_8.py
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM acceleration for hosted emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 35 emulator instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew --no-daemon --max-workers=2 :app:connectedDebugAndroidTest
      - name: Upload device-test results, even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-emulator-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            **/build/outputs/androidTest-results/**
            **/build/reports/androidTests/**
          if-no-files-found: ignore
          retention-days: 7
