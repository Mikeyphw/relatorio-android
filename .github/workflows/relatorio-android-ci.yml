# Push/PR qualification remains hosted; untrusted PRs have no release credentials.
name: Relatorio Android CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: relatorio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Hosted unit tests, lint, debug APK and receipt
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Shared hosted Gradle/test/lint/package/evidence
        uses: ./.github/actions/verified-debug-build
