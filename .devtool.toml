[project]
kind = "android"

[execution]
environment = "auto"
chroot_name = "androidos"

[targets.relatorio_android]
type = "android"
root = "."
execution_environment = "auto"
chroot_name = "androidos"

[targets.relatorio_android.android]
variant = "debug"
aapt2_provider = "auto"
instrumentation = "never"
prefer_native_termux = false

[targets.relatorio_android.gradle]
version = "9.4.1"
max_workers = 1
structured_events = false
no_daemon = true
parallel = false
build_cache = false
fail_fast = true
offline = false
args = [
  "--no-build-cache",
  "--no-configuration-cache",
  "-Dorg.gradle.parallel=false",
  "-Dorg.gradle.vfs.watch=false",
  "-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8",
  "-Pkotlin.incremental=false",
  "-Pkotlin.compiler.execution.strategy=in-process",
]

[targets.relatorio_android.tasks]
restore = ["help"]
build = ["assembleDebug", ":app:assembleDebugAndroidTest"]
test = [":core-model:test", ":persistence:testDebugUnitTest", ":app:testDebugUnitTest"]
lint = ["lintDebug"]
clean = ["clean"]

[validation]
android_safe = true
max_workers = 1
cpu_limit = 2
split_gradle = true
no_daemon = true
low_priority = true
parallel = false
gradle_heap_mb = 1536
gradle_metaspace_mb = 768
memory_guard_mb = 256
