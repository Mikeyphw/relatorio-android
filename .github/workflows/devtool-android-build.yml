# Devtool ACTIONS-05: exact 4 dispatch inputs, hosted-only Gradle and debug artifacts.
name: Relatorio Android Devtool Build
on:
  workflow_dispatch:
    inputs:
      project_dir:
        description: 'Checked-in Gradle root'
        type: choice
        required: true
        default: '.'
        options: ['.']
      module:
        description: 'Checked-in Android application'
        type: choice
        required: true
        default: app
        options: [app]
      variant:
        description: 'Debug only'
        type: choice
        required: true
        default: debug
        options: [debug]
      format:
        description: 'APK only'
        type: choice
        required: true
        default: apk
        options: [apk]
permissions:
  contents: read
concurrency:
  group: relatorio-devtool-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    name: Hosted verified debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout selected SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject noncanonical Devtool inputs
        env:
          DT_PROJECT: ${{ inputs.project_dir }}
          DT_MODULE: ${{ inputs.module }}
          DT_VARIANT: ${{ inputs.variant }}
          DT_FORMAT: ${{ inputs.format }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$DT_PROJECT" = '.'
          test "$DT_MODULE" = 'app'
          test "$DT_VARIANT" = 'debug'
          test "$DT_FORMAT" = 'apk'
      - name: Shared hosted Gradle/test/lint/package/evidence
        uses: ./.github/actions/verified-debug-build
