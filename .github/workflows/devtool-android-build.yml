# Debug-only build for Devtool ACTIONS-05. Do not add release signing secrets here.
name: Relatorio Android Devtool Build
on:
  workflow_dispatch:
    inputs:
      project_dir:
        description: 'Gradle root (fixed, checked-in project)'
        type: choice
        required: true
        default: '.'
        options: ['.']
      module:
        description: 'Android application module'
        type: choice
        required: true
        default: app
        options: [app]
      variant:
        description: 'Debug builds only'
        type: choice
        required: true
        default: debug
        options: [debug]
      format:
        description: 'Installable Android APK'
        type: choice
        required: true
        default: apk
        options: [apk]
permissions:
  contents: read
concurrency:
  group: relatorio-devtool-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    name: Validated debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact selected source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check immutable dispatch choices and source
        env:
          DT_PROJECT: ${{ inputs.project_dir }}
          DT_MODULE: ${{ inputs.module }}
          DT_VARIANT: ${{ inputs.variant }}
          DT_FORMAT: ${{ inputs.format }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$DT_PROJECT" = '.'
          test "$DT_MODULE" = 'app'
          test "$DT_VARIANT" = 'debug'
          test "$DT_FORMAT" = 'apk'
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          python3 scripts/verify_relatorio_actions.py --static
          python3 tools/validate_phase9_10.py
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK 36 build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests, compile device tests, lint and build APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=2 \
            :core-model:test \
            :persistence:testDebugUnitTest \
            :app:testDebugUnitTest \
            :persistence:compileDebugAndroidTestKotlin \
            :app:compileDebugAndroidTestKotlin \
            :app:lintDebug \
            :app:assembleDebug
      - name: Check APK certificate, manifest and generate source-bound evidence
        id: package
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk" && test ! -L "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.mikeyphw.relatorio.android.debug'"
          stage="$RUNNER_TEMP/relatorio-devtool-verified"
          mkdir -p "$stage"
          cp -- "$apk" "$stage/relatorio-mensal-ad-debug.apk"
          python3 scripts/verify_relatorio_actions.py \
            --evidence "$stage/relatorio-mensal-ad-debug.apk" "$stage/build-evidence.json"
          sha256sum "$stage/relatorio-mensal-ad-debug.apk"
          echo "artifact_dir=$stage" >> "$GITHUB_OUTPUT"
      - name: Upload debug APK and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-android-debug-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.package.outputs.artifact_dir }}/
          if-no-files-found: error
          retention-days: 7
      - name: Upload unit test and lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-debug-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7
